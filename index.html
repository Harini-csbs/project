<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>finance-dashboard</title>
  </head>
  <body>
    <div class="ledger-container">
  <h2>LOG LEDGER ITEM </h2>
  <form class="ledger-form">
    <!-- Row 1: Spans full width -->
    <div class="form-group full-width">
      <label>Transaction Descriptor</label>
      <input type="text" class="custom-field" placeholder="Enter description...">
    </div>
    
    <!-- Row 2: 2 Column Grid split -->
    <div class="form-group">
      <label>Volume Amount</label>
      <input type="number" class="custom-field" placeholder="0.00">
    </div>
    
    <div class="form-group">
      <label>Sector</label>
      <select class="custom-field">
        <option>Food</option>
        <option>Housing</option>
        <option>Utilities</option>
      </select>
    </div>
    
    <!-- Row 3: 2 Column Grid split -->
    <div class="form-group">
      <label>Date Timestamp</label>
      <input type="date" class="custom-field">
    </div>
    
    <div class="form-group">
      <label>Flow Type</label>
      <select class="custom-field">
        <option>Expense Pool</option>
        <option>Income Pool</option>
      </select>
    </div>
    
    <!-- Action Footer Row -->
    <div class="form-actions">
      <button type="submit" class="btn-submit">Commit Entry</button>
    </div>
  </form>
</div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
